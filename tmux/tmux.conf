# steves-cli-setup — tmux configuration
# https://github.com/steve-berlin/steves-cli-setup
#
# Ordering matters and is deliberate:
#   1. options   2. keybindings   3. theme   4. user overrides   5. plugins
# See CLAUDE.md for why the user override file is sourced before the plugins.

# ── Terminal ──────────────────────────────────────────────────────────────────

# `tmux-256color` advertises the full terminfo capabilities tmux itself
# implements. `screen-256color` is the older default and lacks italics.
set -g default-terminal "tmux-256color"

# Tell tmux what the *outer* terminal can do. `terminal-features` is the modern
# replacement for the `terminal-overrides ",*:Tc"` incantation and covers
# 24-bit colour, undercurl and styled underlines.
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"

# Pass through focus notifications. Editors use them to reload changed files,
# and pane dimming cannot work without them.
set -g focus-events on

# ── Limits ────────────────────────────────────────────────────────────────────

# 2000 lines of scrollback is roughly one build log. 50k costs a few MB per
# busy pane, which is a fair trade on any machine made this decade.
set -g history-limit 50000

# tmux waits this long after ESC to decide whether it began an escape sequence.
# The 500ms default makes vim's ESC feel broken. Not 0: that breaks some
# terminals over slow SSH links.
set -sg escape-time 10

# Status messages at the default 750ms disappear before they can be read.
set -g display-time 2000
set -g display-panes-time 2000

# The status bar redraws on this interval, so it also bounds clock drift and
# how promptly tmux-continuum notices it is time to save.
set -g status-interval 5

set -g repeat-time 300

# ── Windows and panes ─────────────────────────────────────────────────────────

# Number windows and panes from 1 — it matches the keyboard.
set -g base-index 1
setw -g pane-base-index 1

# Close a gap in the window list immediately rather than leaving 1, 3, 4.
set -g renumber-windows on

# Size a window to the smallest client actually looking at it, instead of the
# smallest client merely attached to the session.
setw -g aggressive-resize on

# Let the terminal title reflect the active tmux window.
set -g set-titles on
set -g set-titles-string "#S · #W"

# Deliberately off: this setup is keyboard-only. Turning it on also hands
# scrollback to tmux's copy mode, which breaks the terminal's own scrollbar.
set -g mouse off

# ── Keybindings ───────────────────────────────────────────────────────────────

# C-a is easier to reach, but C-b stays bound so that muscle memory built on
# stock tmux — and every tutorial on the internet — still works here.
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix

bind R source-file ~/.tmux.conf \; display "Configuration reloaded"

# Splits inherit the current directory; the stock bindings always start at $HOME.
# The glyphs match the split: | is vertical, - is horizontal.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Unbind the mnemonic-free stock split keys so the pair above is the one answer.
unbind '"'
unbind %

# vi-style pane movement, repeatable within `repeat-time`.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Fuzzy session and window switching in a popup, replacing tmux's own list.
# Falls back to the stock `choose-tree` bindings when fzf is absent.
#
# The session and window names are extracted with cut rather than `list-*  -F`
# because tmux expands `#{...}` in a command string before the shell ever sees
# it, so a format specifier here would be substituted at bind time.
if-shell 'command -v fzf >/dev/null 2>&1' \
  "bind s display-popup -E -w 60% -h 60% 'tmux list-sessions | cut -d: -f1 | fzf --reverse --prompt=\"session > \" | xargs -r tmux switch-client -t'"
if-shell 'command -v fzf >/dev/null 2>&1' \
  "bind w display-popup -E -w 60% -h 60% 'tmux list-windows -a | cut -d\" \" -f1 | sed \"s/:\$//\" | fzf --reverse --prompt=\"window > \" | xargs -r tmux switch-client -t'"

# ── Copy mode ─────────────────────────────────────────────────────────────────

setw -g mode-keys vi
set -g status-keys emacs

# OSC 52. Lets a copy inside tmux reach the clipboard of whatever machine the
# terminal is running on, which is the only thing that works over SSH.
set -g set-clipboard on

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# Three flat cases, applied in order of increasing preference, so the last one
# whose tool is present wins. Nesting `if-shell` here would be unreadable.
bind -T copy-mode-vi y send -X copy-selection-and-cancel
if-shell 'command -v xclip >/dev/null 2>&1' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"'
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"'

# ── Theme ─────────────────────────────────────────────────────────────────────
#
# Nord palette, used consistently below:
#   #2e3440 base      #3b4252 surface   #4c566a raised    #d8dee9 text
#   #eceff4 bright    #88c0d0 accent    #ebcb8b warning   #bf616a error
#
# The separators are U+E0B0/U+E0B2 and the icons are Nerd Font v3, both of
# which `install.sh` provides. To go plain-text instead, override the four
# `status-*` and `window-status-*` formats in ~/.tmux.conf.local.

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
set -g status-style "bg=#3b4252,fg=#d8dee9"

set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold]  #S #[fg=#88c0d0,bg=#3b4252,nobold]"

set -g window-status-separator ""
setw -g window-status-format "#[fg=#d8dee9,bg=#3b4252] #I #W#{?window_last_flag,-,} "
setw -g window-status-current-format "#[fg=#3b4252,bg=#4c566a]#[fg=#eceff4,bg=#4c566a,bold] #I #W#{?window_zoomed_flag,  ,} #[fg=#4c566a,bg=#3b4252,nobold]"

# The prefix indicator is the reason `prefix2` is safe to keep: it is otherwise
# impossible to tell which of the two prefixes armed the session.
set -g status-right "#{?client_prefix,#[fg=#2e3440#,bg=#ebcb8b#,bold]   ,}#[fg=#4c566a,bg=#3b4252]#[fg=#d8dee9,bg=#4c566a]  #h #[fg=#88c0d0,bg=#4c566a]#[fg=#2e3440,bg=#88c0d0,bold]  %H:%M "

# Flag windows that produced output while unfocused, but never interrupt with a
# modal message to say so.
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style "fg=#ebcb8b,bg=#3b4252"
setw -g window-status-bell-style "fg=#bf616a,bg=#3b4252,bold"

set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"

set -g message-style "bg=#ebcb8b,fg=#2e3440,bold"
set -g message-command-style "bg=#ebcb8b,fg=#2e3440"
setw -g mode-style "bg=#88c0d0,fg=#2e3440"

setw -g clock-mode-colour "#88c0d0"
setw -g clock-mode-style 24

# ── Pane dimming ──────────────────────────────────────────────────────────────
#
# No plugin. tmux applies `window-style` to every pane and then overrides the
# focused one with `window-active-style`, which is exactly pane dimming and has
# been built in since 1.9. The dim-pane plugins are all unmaintained wrappers
# around these two options; do not reintroduce one.
#
# Dimming is a foreground shift, not a background one: repainting pane
# backgrounds fights with any application that draws its own (vim, less, htop).
set -g window-style "fg=#8b93a5"
set -g window-active-style "fg=#d8dee9"

# ── User overrides ────────────────────────────────────────────────────────────
#
# Sourced before the plugins on purpose. tmux-continuum reads @continuum-restore
# when it loads and appends its save hook to `status-right`, so a local file
# sourced afterwards could silently disable auto-save by replacing that format.
if-shell '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'

# ── Plugins ───────────────────────────────────────────────────────────────────
#
# Version-pinned git submodules under ~/.tmux/vendor, sourced directly. No TPM,
# no network access at start, and the exact commit is recorded in this repo.

# Restore pane contents as well as the layout, and bring back the programs that
# were running. Anything not on this list is restored as a plain shell, which is
# the safe default -- resurrect re-executes these command lines verbatim.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'vi vim nvim emacs man less more tail top htop btop ssh psql mysql sqlite3 irssi weechat'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Save every 15 minutes and restore automatically when the tmux server starts.
# prefix + C-s and prefix + C-r still work at any time for a manual save/restore.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

run-shell ~/.local/share/steves-cli-setup/vendor/tmux-resurrect/resurrect.tmux

# Resumes AI assistant sessions (Claude Code, OpenCode, Codex, Pi, Grok) with
# their conversation intact, which plain resurrect cannot do: it would restart
# the bare binary and lose the thread. Works by hanging two hooks off resurrect,
# @resurrect-hook-post-save-all and -post-restore-all, so it must be sourced
# after resurrect and before continuum.
#
# Upstream documents a TPM install; this repo uses none, and the plugin's entry
# point is an ordinary bash script, so run-shell loads it exactly as TPM would.
#
# Two side effects beyond tmux, both on every server start and both idempotent:
# it adds SessionStart/SessionEnd hooks to ~/.claude/settings.json (needs jq;
# skipped silently without it) and symlinks a session tracker into
# ~/.config/opencode/plugins/. Nothing else in this repo writes outside its own
# files -- this plugin is the exception, which is why it is called out here.
#
# It also defaults @continuum-save-interval to 5 and @continuum-restore to on.
# Both are set above, and it only fills in an unset interval, so 15 stands.
run-shell ~/.local/share/steves-cli-setup/vendor/tmux-assistant-resurrect/tmux-assistant-resurrect.tmux

# Must stay last. Continuum drives its timer off `status-right`, so any later
# change to that format stops auto-save without reporting an error.
run-shell ~/.local/share/steves-cli-setup/vendor/tmux-continuum/continuum.tmux
